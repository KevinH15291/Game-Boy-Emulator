<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>CGB Emulator</title>
    <style>
      body {
        margin: 0;
        background: #111;
        color: #eee;
        font-family: sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        position: relative;
      }
      #controls,
      #channelToggles {
        padding: 0.5rem;
        display: flex;
        gap: 0.5rem;
        align-items: center;
        justify-content: center;
        width: 100%;
      }
      #exportSaveBtn {
        background: #333;
        color: #eee;
        border: 1px solid #555;
        padding: 0.5rem 1rem;
        border-radius: 4px;
        cursor: pointer;
        font-family: sans-serif;
      }
      #exportSaveBtn:hover {
        background: #444;
      }
      #exportSaveBtn:active {
        background: #222;
      }
      #importSaveBtn {
        background: #333;
        color: #eee;
        border: 1px solid #555;
        padding: 0.5rem 1rem;
        border-radius: 4px;
        cursor: pointer;
        font-family: sans-serif;
      }
      #importSaveBtn:hover {
        background: #444;
      }
      #importSaveBtn:active {
        background: #222;
      }
      #volumeControl {
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }
      #volumeSlider {
        width: 150px;
        height: 6px;
        background: #333;
        border-radius: 3px;
        outline: none;
        -webkit-appearance: none;
      }
      #volumeSlider::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 16px;
        height: 16px;
        background: #eee;
        border-radius: 50%;
        cursor: pointer;
      }
      #volumeSlider::-moz-range-thumb {
        width: 16px;
        height: 16px;
        background: #eee;
        border-radius: 50%;
        cursor: pointer;
        border: none;
      }
      #volumeLabel {
        font-size: 0.875rem;
        min-width: 40px;
        text-align: right;
      }
      .keybinding {
        font-size: 0.75rem;
        color: #888;
        margin-left: 0.5rem;
        font-family: monospace;
      }
      button {
        position: relative;
      }
      #romInputLabel {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
      }
      #channelToggles label {
        display: flex;
        align-items: center;
        gap: 0.25rem;
        background: #222;
        padding: 0.25rem 0.5rem;
        border-radius: 4px;
      }
      #canvas {
        width: 640px;
        height: 576px;
        image-rendering: pixelated;
        border: 1px solid #333;
        background: #000;
        margin: 1rem 0;
      }
      #fpsCounter {
        position: absolute;
        top: 0.5rem;
        right: 0.5rem;
        background: rgba(0, 0, 0, 0.7);
        padding: 0.25rem 0.5rem;
        border-radius: 4px;
        font-family: monospace;
        font-size: 0.875rem;
      }
      #keybindings {
        position: absolute;
        bottom: 0.5rem;
        left: 0.5rem;
        background: rgba(0, 0, 0, 0.7);
        padding: 0.5rem;
        border-radius: 4px;
        font-family: monospace;
        font-size: 0.75rem;
        line-height: 1.4;
        max-width: 200px;
      }
      #keybindings h3 {
        margin: 0 0 0.5rem 0;
        font-size: 0.875rem;
        color: #fff;
      }
      #keybindings div {
        display: flex;
        justify-content: space-between;
        gap: 1rem;
        margin: 0.25rem 0;
      }
      #keybindings .key {
        color: #aaa;
        font-weight: bold;
      }
      #keybindings .action {
        color: #eee;
      }
    </style>
  </head>
  <body>
    <div id="controls">
      <div id="romInputLabel">
        <input type="file" id="romInput" accept=".gb,.gbc" />
        <span class="keybinding">Ctrl+O</span>
      </div>
      <input
        type="file"
        id="saveInput"
        accept=".bin,.sav"
        style="display: none"
      />
      <button id="importSaveBtn">
        Import Save<span class="keybinding">Ctrl+I</span>
      </button>
      <button id="exportSaveBtn">
        Export Save<span class="keybinding">Ctrl+E</span>
      </button>
      <div id="volumeControl">
        <label for="volumeSlider" style="font-size: 0.875rem">Volume:</label>
        <input type="range" id="volumeSlider" min="0" max="100" value="100" />
        <span id="volumeLabel">100%</span>
        <span class="keybinding">+/-</span>
      </div>
      <span id="status">Initializing…</span>
    </div>
    <div id="channelToggles">
      <label
        ><input type="checkbox" data-channel="0" checked /> Ch1<span
          class="keybinding"
          >1</span
        ></label
      >
      <label
        ><input type="checkbox" data-channel="1" checked /> Ch2<span
          class="keybinding"
          >2</span
        ></label
      >
      <label
        ><input type="checkbox" data-channel="2" checked /> Ch3<span
          class="keybinding"
          >3</span
        ></label
      >
      <label
        ><input type="checkbox" data-channel="3" checked /> Ch4<span
          class="keybinding"
          >4</span
        ></label
      >
    </div>
    <div id="fpsCounter">FPS: --</div>
    <div id="keybindings">
      <h3>Controls</h3>
      <div><span class="action">A</span><span class="key">X</span></div>
      <div><span class="action">B</span><span class="key">Z</span></div>
      <div><span class="action">Select</span><span class="key">/</span></div>
      <div><span class="action">Start</span><span class="key">Enter</span></div>
      <div><span class="action">Right</span><span class="key">→</span></div>
      <div><span class="action">Left</span><span class="key">←</span></div>
      <div><span class="action">Up</span><span class="key">↑</span></div>
      <div><span class="action">Down</span><span class="key">↓</span></div>
    </div>
    <canvas id="canvas"></canvas>
    <script>
      const statusEl = document.getElementById("status");
      const fpsEl = document.getElementById("fpsCounter");
      let runtimeReady = false;
      let lastFrameCount = 0;
      let lastFpsUpdate = 0;
      var Module = typeof Module !== "undefined" ? Module : {};
      Module.canvas = document.getElementById("canvas");
      Module.onRuntimeInitialized = function () {
        runtimeReady = true;
        statusEl.textContent = "Ready";
        console.log("Runtime initialized");
        console.log("Module.HEAPU8 available:", !!Module.HEAPU8);
        console.log("Module._malloc available:", !!Module._malloc);
        console.log("Module._upload_rom available:", !!Module._upload_rom);
        if (Module._is_channel_muted) {
          document.querySelectorAll("#channelToggles input").forEach((el) => {
            const channel = parseInt(el.dataset.channel, 10);
            el.checked = Module._is_channel_muted(channel) === 0 ? true : false;
          });
        }
        lastFpsUpdate = performance.now();
        updateFPS();
        if (Module._get_master_volume) {
          const volume = Module._get_master_volume();
          const volumeSlider = document.getElementById("volumeSlider");
          const volumeLabel = document.getElementById("volumeLabel");
          if (volumeSlider && volumeLabel) {
            volumeSlider.value = Math.round(volume * 100);
            volumeLabel.textContent = Math.round(volume * 100) + "%";
          }
        }
      };

      function updateFPS() {
        if (!runtimeReady || !Module._get_frame_count) {
          requestAnimationFrame(updateFPS);
          return;
        }
        const now = performance.now();
        const currentFrameCount = Module._get_frame_count();
        const elapsed = now - lastFpsUpdate;

        if (elapsed >= 1000) {
          const fps = ((currentFrameCount - lastFrameCount) * 1000) / elapsed;
          fpsEl.textContent = `FPS: ${fps.toFixed(1)}`;
          lastFrameCount = currentFrameCount;
          lastFpsUpdate = now;
        }

        requestAnimationFrame(updateFPS);
      }

      const KEY_MAP = {
        KeyX: { button: 0, pressed: false },
        KeyZ: { button: 1, pressed: false },
        Slash: { button: 2, pressed: false }, // Select
        Enter: { button: 3, pressed: false }, // Start
        ArrowRight: { button: 4, pressed: false },
        ArrowLeft: { button: 5, pressed: false },
        ArrowUp: { button: 6, pressed: false },
        ArrowDown: { button: 7, pressed: false },
      };

      function updateKey(event, isPressed) {
        const entry = KEY_MAP[event.code];
        if (!entry || !runtimeReady) return;
        if (entry.pressed === isPressed) return;
        entry.pressed = isPressed;
        if (Module._set_button_state) {
          Module._set_button_state(entry.button, isPressed ? 1 : 0);
        }
        event.preventDefault();
      }

      window.addEventListener("keydown", (e) => updateKey(e, true));
      window.addEventListener("keyup", (e) => updateKey(e, false));

      window.addEventListener("keydown", (e) => {
        if (e.ctrlKey || e.metaKey) {
          if (e.key === "o" || e.key === "O") {
            e.preventDefault();
            document.getElementById("romInput").click();
          } else if (e.key === "i" || e.key === "I") {
            e.preventDefault();
            document.getElementById("saveInput").click();
          } else if (e.key === "e" || e.key === "E") {
            e.preventDefault();
            document.getElementById("exportSaveBtn").click();
          }
        } else if (e.key === "+" || e.key === "=") {
          e.preventDefault();
          const volumeSlider = document.getElementById("volumeSlider");
          if (volumeSlider) {
            const current = parseInt(volumeSlider.value);
            volumeSlider.value = Math.min(100, current + 5);
            volumeSlider.dispatchEvent(new Event("input"));
          }
        } else if (e.key === "-" || e.key === "_") {
          e.preventDefault();
          const volumeSlider = document.getElementById("volumeSlider");
          if (volumeSlider) {
            const current = parseInt(volumeSlider.value);
            volumeSlider.value = Math.max(0, current - 5);
            volumeSlider.dispatchEvent(new Event("input"));
          }
        } else if (e.key >= "1" && e.key <= "4") {
          e.preventDefault();
          const channel = parseInt(e.key) - 1;
          const checkbox = document.querySelector(
            `#channelToggles input[data-channel="${channel}"]`
          );
          if (checkbox) {
            checkbox.checked = !checkbox.checked;
            checkbox.dispatchEvent(new Event("change"));
          }
        }
      });

      document.getElementById("romInput").addEventListener("change", (e) => {
        const file = e.target.files[0];
        if (!file) return;
        if (!runtimeReady) {
          statusEl.textContent = "Runtime still starting…";
          return;
        }
        statusEl.textContent = `Loading ${file.name}…`;
        const reader = new FileReader();
        reader.onload = function () {
          const data = new Uint8Array(reader.result);
          let ptr = 0;
          try {
            if (!Module._malloc || !Module._free) {
              throw new Error("Allocator not ready");
            }
            ptr = Module._malloc(data.length);
            if (!ptr) {
              throw new Error("Failed to allocate memory");
            }
            if (Module.writeArrayToMemory) {
              Module.writeArrayToMemory(data, ptr);
            } else if (Module.HEAPU8) {
              Module.HEAPU8.set(data, ptr);
            } else if (Module.HEAP8) {
              for (let i = 0; i < data.length; i++) {
                Module.HEAP8[ptr + i] = data[i];
              }
            } else {
              for (let i = 0; i < data.length; i++) {
                Module.setValue(ptr + i, data[i], "i8");
              }
            }
            const result = Module.ccall(
              "upload_rom",
              "number",
              ["number", "number"],
              [ptr, data.length]
            );
            console.log("upload_rom returned", result);
            statusEl.textContent =
              result === 1 ? `Loaded ${file.name}` : "Failed to load ROM";
          } catch (err) {
            console.error("ROM upload threw", err);
            statusEl.textContent = "Error loading ROM: " + err.message;
          } finally {
            if (ptr && Module._free) {
              Module._free(ptr);
            }
          }
        };
        reader.onerror = (err) => {
          console.error("FileReader error", err);
          statusEl.textContent = "Error reading ROM";
        };
        reader.readAsArrayBuffer(file);
      });

      document.querySelectorAll("#channelToggles input").forEach((el) => {
        el.addEventListener("change", () => {
          if (!runtimeReady || !Module._set_channel_muted) return;
          const channel = parseInt(el.dataset.channel, 10);
          Module._set_channel_muted(channel, el.checked ? 0 : 1);
        });
      });

      document.getElementById("exportSaveBtn").addEventListener("click", () => {
        if (
          !runtimeReady ||
          !Module._get_cart_ram_ptr ||
          !Module._get_cart_ram_size
        ) {
          statusEl.textContent = "Not ready";
          return;
        }
        try {
          const ptr = Module._get_cart_ram_ptr();
          const size = Module._get_cart_ram_size();
          if (!ptr || size <= 0) {
            statusEl.textContent = "No save data available";
            return;
          }
          const ramData = new Uint8Array(Module.HEAPU8.buffer, ptr, size);
          const blob = new Blob([ramData], {
            type: "application/octet-stream",
          });
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = "save.bin";
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
          statusEl.textContent = "Save exported";
        } catch (err) {
          console.error("Export save error", err);
          statusEl.textContent = "Error exporting save";
        }
      });

      document.getElementById("importSaveBtn").addEventListener("click", () => {
        document.getElementById("saveInput").click();
      });

      document.getElementById("saveInput").addEventListener("change", (e) => {
        const file = e.target.files[0];
        if (!file) return;
        if (!runtimeReady) {
          statusEl.textContent = "Runtime still starting…";
          return;
        }
        statusEl.textContent = `Loading ${file.name}…`;
        const reader = new FileReader();
        reader.onload = function () {
          const data = new Uint8Array(reader.result);
          let ptr = 0;
          try {
            if (!Module._malloc || !Module._free) {
              throw new Error("Allocator not ready");
            }
            ptr = Module._malloc(data.length);
            if (!ptr) {
              throw new Error("Failed to allocate memory");
            }
            if (Module.writeArrayToMemory) {
              Module.writeArrayToMemory(data, ptr);
            } else if (Module.HEAPU8) {
              Module.HEAPU8.set(data, ptr);
            } else if (Module.HEAP8) {
              for (let i = 0; i < data.length; i++) {
                Module.HEAP8[ptr + i] = data[i];
              }
            } else {
              for (let i = 0; i < data.length; i++) {
                Module.setValue(ptr + i, data[i], "i8");
              }
            }
            const result = Module.ccall(
              "import_save",
              "number",
              ["number", "number"],
              [ptr, data.length]
            );
            console.log("import_save returned", result);
            statusEl.textContent =
              result === 1 ? `Loaded ${file.name}` : "Failed to load save";
          } catch (err) {
            console.error("Save import threw", err);
            statusEl.textContent = "Error loading save: " + err.message;
          } finally {
            if (ptr && Module._free) {
              Module._free(ptr);
            }
          }
        };
        reader.onerror = (err) => {
          console.error("FileReader error", err);
          statusEl.textContent = "Error reading save";
        };
        reader.readAsArrayBuffer(file);
        e.target.value = "";
      });

      const volumeSlider = document.getElementById("volumeSlider");
      const volumeLabel = document.getElementById("volumeLabel");
      if (volumeSlider && volumeLabel) {
        volumeSlider.addEventListener("input", (e) => {
          const volume = parseFloat(e.target.value) / 100.0;
          volumeLabel.textContent = Math.round(volume * 100) + "%";
          if (runtimeReady && Module._set_master_volume) {
            Module._set_master_volume(volume);
          }
        });
      }
    </script>
    <script async type="text/javascript" src="GBC.js"></script>
  </body>
</html>
