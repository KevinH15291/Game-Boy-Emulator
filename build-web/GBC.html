<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>CGB Emulator</title>
    <style>
      body {
        margin: 0;
        background: #111;
        color: #eee;
        font-family: sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      #controls {
        padding: 0.5rem;
        display: flex;
        gap: 0.5rem;
        align-items: center;
        justify-content: center;
        width: 100%;
      }
      #canvas {
        width: 320px;
        height: 288px;
        image-rendering: pixelated;
        border: 1px solid #333;
        background: #000;
        margin: 1rem 0;
      }
    </style>
  </head>
  <body>
    <div id="controls">
      <input type="file" id="romInput" accept=".gb,.gbc" />
      <span id="status">Initializing…</span>
    </div>
    <canvas id="canvas"></canvas>
    <script>
      const statusEl = document.getElementById("status");
      let runtimeReady = false;
      var Module = typeof Module !== "undefined" ? Module : {};
      Module.canvas = document.getElementById("canvas");
      Module.onRuntimeInitialized = function () {
        runtimeReady = true;
        statusEl.textContent = "Ready";
        console.log("Runtime initialized");
      };

      const KEY_MAP = {
        KeyX: { button: 0, pressed: false },
        KeyZ: { button: 1, pressed: false },
        Slash: { button: 2, pressed: false }, // Select
        Enter: { button: 3, pressed: false }, // Start
        ArrowRight: { button: 4, pressed: false },
        ArrowLeft: { button: 5, pressed: false },
        ArrowUp: { button: 6, pressed: false },
        ArrowDown: { button: 7, pressed: false },
      };

      function updateKey(event, isPressed) {
        const entry = KEY_MAP[event.code];
        if (!entry || !runtimeReady) return;
        if (entry.pressed === isPressed) return;
        entry.pressed = isPressed;
        if (Module._set_button_state) {
          Module._set_button_state(entry.button, isPressed ? 1 : 0);
        }
        event.preventDefault();
      }

      window.addEventListener("keydown", (e) => updateKey(e, true));
      window.addEventListener("keyup", (e) => updateKey(e, false));

      document.getElementById("romInput").addEventListener("change", (e) => {
        const file = e.target.files[0];
        if (!file) return;
        if (!runtimeReady) {
          statusEl.textContent = "Runtime still starting…";
          return;
        }
        statusEl.textContent = `Loading ${file.name}…`;
        const reader = new FileReader();
        reader.onload = function () {
          const data = new Uint8Array(reader.result);
          let ptr = 0;
          try {
            if (!Module._malloc || !Module._free) {
              throw new Error("Allocator not ready");
            }
            ptr = Module._malloc(data.length);
            Module.HEAPU8.set(data, ptr);
            const result = Module.ccall(
              "upload_rom",
              "number",
              ["number", "number"],
              [ptr, data.length]
            );
            console.log("upload_rom returned", result);
            statusEl.textContent =
              result === 1 ? `Loaded ${file.name}` : "Failed to load ROM";
          } catch (err) {
            console.error("ROM upload threw", err);
            statusEl.textContent = "Error loading ROM";
          } finally {
            if (ptr && Module._free) {
              Module._free(ptr);
            }
          }
        };
        reader.onerror = (err) => {
          console.error("FileReader error", err);
          statusEl.textContent = "Error reading ROM";
        };
        reader.readAsArrayBuffer(file);
      });
    </script>
    <script async type="text/javascript" src="GBC.js"></script>
  </body>
</html>
