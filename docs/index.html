<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>CGB Emulator</title>
    <style>
      body {
        margin: 0;
        background: #111;
        color: #eee;
        font-family: sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        position: relative;
      }
      #controls,
      #channelToggles {
        padding: 0.5rem;
        display: flex;
        gap: 0.5rem;
        align-items: center;
        justify-content: center;
        width: 100%;
      }
      #exportSaveBtn {
        background: #333;
        color: #eee;
        border: 1px solid #555;
        padding: 0.5rem 1rem;
        border-radius: 4px;
        cursor: pointer;
        font-family: sans-serif;
      }
      #exportSaveBtn:hover {
        background: #444;
      }
      #exportSaveBtn:active {
        background: #222;
      }
      #importSaveBtn {
        background: #333;
        color: #eee;
        border: 1px solid #555;
        padding: 0.5rem 1rem;
        border-radius: 4px;
        cursor: pointer;
        font-family: sans-serif;
      }
      #importSaveBtn:hover {
        background: #444;
      }
      #importSaveBtn:active {
        background: #222;
      }
      #volumeControl {
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }
      #volumeSlider {
        width: 150px;
        height: 6px;
        background: #333;
        border-radius: 3px;
        outline: none;
        -webkit-appearance: none;
      }
      #volumeSlider::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 16px;
        height: 16px;
        background: #eee;
        border-radius: 50%;
        cursor: pointer;
      }
      #volumeSlider::-moz-range-thumb {
        width: 16px;
        height: 16px;
        background: #eee;
        border-radius: 50%;
        cursor: pointer;
        border: none;
      }
      #volumeLabel {
        font-size: 0.875rem;
        min-width: 40px;
        text-align: right;
      }
      .keybinding {
        font-size: 0.75rem;
        color: #888;
        margin-left: 0.5rem;
        font-family: monospace;
      }
      button {
        position: relative;
      }
      #romInputLabel {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
      }
      #channelToggles label {
        display: flex;
        align-items: center;
        gap: 0.25rem;
        background: #222;
        padding: 0.25rem 0.5rem;
        border-radius: 4px;
      }
      #canvas {
        width: 640px;
        height: 576px;
        image-rendering: pixelated;
        border: 1px solid #333;
        background: #000;
        margin: 1rem 0;
      }
      #fpsCounter {
        position: absolute;
        top: 0.5rem;
        right: 0.5rem;
        background: rgba(0, 0, 0, 0.7);
        padding: 0.25rem 0.5rem;
        border-radius: 4px;
        font-family: monospace;
        font-size: 0.875rem;
      }
      #keybindings {
        position: absolute;
        bottom: 0.5rem;
        left: 0.5rem;
        background: rgba(0, 0, 0, 0.7);
        padding: 0.5rem;
        border-radius: 4px;
        font-family: monospace;
        font-size: 0.75rem;
        line-height: 1.4;
        max-width: 200px;
      }
      #keybindings h3 {
        margin: 0 0 0.5rem 0;
        font-size: 0.875rem;
        color: #fff;
      }
      #keybindings div {
        display: flex;
        justify-content: space-between;
        gap: 1rem;
        margin: 0.25rem 0;
      }
      #keybindings .key {
        color: #aaa;
        font-weight: bold;
      }
      #keybindings .action {
        color: #eee;
      }
    </style>
  </head>
  <body>
    <div id="controls">
      <div id="romInputLabel">
        <input type="file" id="romInput" accept=".gb,.gbc" />
        <span class="keybinding">Ctrl+O</span>
      </div>
      <input
        type="file"
        id="saveInput"
        accept=".bin,.sav"
        style="display: none"
      />
      <button id="importSaveBtn">
        Import Save<span class="keybinding">Ctrl+I</span>
      </button>
      <button id="exportSaveBtn">
        Export Save<span class="keybinding">Ctrl+E</span>
      </button>
      <div id="volumeControl">
        <label for="volumeSlider" style="font-size: 0.875rem">Volume:</label>
        <input type="range" id="volumeSlider" min="0" max="100" value="100" />
        <span id="volumeLabel">100%</span>
        <span class="keybinding">+/-</span>
      </div>
      <span id="status">Initializing…</span>
    </div>
    <div id="channelToggles">
      <label
        ><input type="checkbox" data-channel="0" checked /> Ch1<span
          class="keybinding"
          >1</span
        ></label
      >
      <label
        ><input type="checkbox" data-channel="1" checked /> Ch2<span
          class="keybinding"
          >2</span
        ></label
      >
      <label
        ><input type="checkbox" data-channel="2" checked /> Ch3<span
          class="keybinding"
          >3</span
        ></label
      >
      <label
        ><input type="checkbox" data-channel="3" checked /> Ch4<span
          class="keybinding"
          >4</span
        ></label
      >
    </div>
    <div id="fpsCounter">FPS: --</div>
    <div id="keybindings">
      <h3>Controls</h3>
      <div><span class="action">A</span><span class="key">X</span></div>
      <div><span class="action">B</span><span class="key">Z</span></div>
      <div><span class="action">Select</span><span class="key">/</span></div>
      <div><span class="action">Start</span><span class="key">Enter</span></div>
      <div><span class="action">Right</span><span class="key">→</span></div>
      <div><span class="action">Left</span><span class="key">←</span></div>
      <div><span class="action">Up</span><span class="key">↑</span></div>
      <div><span class="action">Down</span><span class="key">↓</span></div>
    </div>
    <canvas id="canvas"></canvas>
    <script type="module">
      import createGBCModule from "./GBC.js";

      const canvas = document.getElementById("canvas");
      const statusEl = document.getElementById("status");
      const fpsEl = document.getElementById("fpsCounter");
      const romInput = document.getElementById("romInput");
      const saveInput = document.getElementById("saveInput");
      const importSaveBtn = document.getElementById("importSaveBtn");
      const exportSaveBtn = document.getElementById("exportSaveBtn");
      const channelCheckboxes = Array.from(
        document.querySelectorAll("#channelToggles input")
      );
      const volumeSlider = document.getElementById("volumeSlider");
      const volumeLabel = document.getElementById("volumeLabel");

      let runtimeReady = false;
      let gbcModule = null;
      let lastFrameCount = 0;
      let lastFpsUpdate = performance.now();

      const KEY_MAP = {
        KeyX: { button: 0, pressed: false },
        KeyZ: { button: 1, pressed: false },
        Slash: { button: 2, pressed: false },
        Enter: { button: 3, pressed: false },
        ArrowRight: { button: 4, pressed: false },
        ArrowLeft: { button: 5, pressed: false },
        ArrowUp: { button: 6, pressed: false },
        ArrowDown: { button: 7, pressed: false },
      };

      const initModule = async () => {
        try {
          gbcModule = await createGBCModule({ canvas });
          runtimeReady = true;
          handleRuntimeReady();
        } catch (error) {
          console.error("Failed to initialize GBC module", error);
          statusEl.textContent = "Initialization failed";
        }
      };

      const handleRuntimeReady = () => {
        statusEl.textContent = "Ready";
        syncChannelToggles();
        syncVolumeUI();
        lastFpsUpdate = performance.now();
      };

      const syncChannelToggles = () => {
        if (!gbcModule?._is_channel_muted) return;
        channelCheckboxes.forEach((checkbox) => {
          const channel = Number(checkbox.dataset.channel);
          checkbox.checked = gbcModule._is_channel_muted(channel) === 0;
        });
      };

      const syncVolumeUI = () => {
        if (!volumeSlider || !volumeLabel || !gbcModule?._get_master_volume) {
          return;
        }
        const volume = gbcModule._get_master_volume();
        const pct = Math.round(volume * 100);
        volumeSlider.value = String(pct);
        volumeLabel.textContent = `${pct}%`;
      };

      const toUint8Array = (result) => {
        if (result instanceof ArrayBuffer) {
          return new Uint8Array(result);
        }
        throw new Error("Unexpected binary payload");
      };

      const copyToHeap = (data, ptr) => {
        if (gbcModule?.writeArrayToMemory) {
          gbcModule.writeArrayToMemory(data, ptr);
        } else if (gbcModule?.HEAPU8) {
          gbcModule.HEAPU8.set(data, ptr);
        } else if (gbcModule?.HEAP8) {
          for (let i = 0; i < data.length; i += 1) {
            gbcModule.HEAP8[ptr + i] = data[i];
          }
        } else {
          throw new Error("No heap view available");
        }
      };

      const callBufferApi = (data, apiName) => {
        if (!runtimeReady || !gbcModule) {
          throw new Error("Runtime not ready");
        }
        if (!gbcModule._malloc || !gbcModule._free) {
          throw new Error("Allocator not ready");
        }
        const ptr = gbcModule._malloc(data.length);
        if (!ptr) {
          throw new Error("Failed to allocate memory");
        }
        try {
          copyToHeap(data, ptr);
          const fn = gbcModule[`_${apiName}`];
          if (typeof fn !== "function") {
            throw new Error(`${apiName} not exported`);
          }
          return fn(ptr, data.length);
        } finally {
          gbcModule._free(ptr);
        }
      };

      const updateFPS = () => {
        if (runtimeReady && gbcModule?._get_frame_count) {
          const now = performance.now();
          const currentFrameCount = gbcModule._get_frame_count();
          const elapsed = now - lastFpsUpdate;
          if (elapsed >= 1000) {
            const fps = ((currentFrameCount - lastFrameCount) * 1000) / elapsed;
            fpsEl.textContent = `FPS: ${fps.toFixed(1)}`;
            lastFrameCount = currentFrameCount;
            lastFpsUpdate = now;
          }
        }
        requestAnimationFrame(updateFPS);
      };

      requestAnimationFrame(updateFPS);

      const updateKey = (event, isPressed) => {
        const entry = KEY_MAP[event.code];
        if (!entry || !runtimeReady || entry.pressed === isPressed) {
          return;
        }
        entry.pressed = isPressed;
        gbcModule?._set_button_state?.(entry.button, isPressed ? 1 : 0);
        event.preventDefault();
      };

      window.addEventListener("keydown", (event) => updateKey(event, true));
      window.addEventListener("keyup", (event) => updateKey(event, false));

      const shutdownRuntime = () => {
        if (runtimeReady && gbcModule?._shutdown_emulator) {
          gbcModule._shutdown_emulator();
          runtimeReady = false;
        }
      };

      window.addEventListener("beforeunload", shutdownRuntime);

      const adjustVolume = (delta) => {
        if (!volumeSlider) return;
        const next = Math.max(
          0,
          Math.min(100, parseInt(volumeSlider.value, 10) + delta)
        );
        volumeSlider.value = String(next);
        volumeSlider.dispatchEvent(new Event("input"));
      };

      const toggleChannelByIndex = (channelIndex) => {
        const checkbox = document.querySelector(
          `#channelToggles input[data-channel="${channelIndex}"]`
        );
        if (!checkbox) return;
        checkbox.checked = !checkbox.checked;
        checkbox.dispatchEvent(new Event("change"));
      };

      window.addEventListener("keydown", (event) => {
        if (event.ctrlKey || event.metaKey) {
          if (event.key === "o" || event.key === "O") {
            event.preventDefault();
            romInput?.click();
          } else if (event.key === "i" || event.key === "I") {
            event.preventDefault();
            saveInput?.click();
          } else if (event.key === "e" || event.key === "E") {
            event.preventDefault();
            exportSaveBtn?.click();
          }
        } else if (event.key === "+" || event.key === "=") {
          event.preventDefault();
          adjustVolume(5);
        } else if (event.key === "-" || event.key === "_") {
          event.preventDefault();
          adjustVolume(-5);
        } else if (event.key >= "1" && event.key <= "4") {
          event.preventDefault();
          toggleChannelByIndex(parseInt(event.key, 10) - 1);
        }
      });

      romInput?.addEventListener("change", (event) => {
        const file = event.target.files?.[0];
        if (!file) return;
        if (!runtimeReady) {
          statusEl.textContent = "Runtime still starting…";
          return;
        }
        statusEl.textContent = `Loading ${file.name}…`;
        const reader = new FileReader();
        reader.onload = () => {
          try {
            const data = toUint8Array(reader.result);
            const result = callBufferApi(data, "upload_rom");
            statusEl.textContent =
              result === 1 ? `Loaded ${file.name}` : "Failed to load ROM";
          } catch (error) {
            console.error("ROM upload failed", error);
            statusEl.textContent = `Error loading ROM: ${error.message}`;
          }
        };
        reader.onerror = () => {
          console.error("FileReader error", reader.error);
          statusEl.textContent = "Error reading ROM";
        };
        reader.readAsArrayBuffer(file);
      });

      channelCheckboxes.forEach((checkbox) => {
        checkbox.addEventListener("change", () => {
          if (!runtimeReady || !gbcModule?._set_channel_muted) return;
          const channel = Number(checkbox.dataset.channel);
          gbcModule._set_channel_muted(channel, checkbox.checked ? 0 : 1);
        });
      });

      exportSaveBtn?.addEventListener("click", () => {
        if (
          !runtimeReady ||
          !gbcModule?._get_cart_ram_ptr ||
          !gbcModule?._get_cart_ram_size
        ) {
          statusEl.textContent = "Not ready";
          return;
        }
        try {
          const ptr = gbcModule._get_cart_ram_ptr();
          const size = gbcModule._get_cart_ram_size();
          if (!ptr || size <= 0) {
            statusEl.textContent = "No save data available";
            return;
          }
          if (!gbcModule?.HEAPU8) {
            statusEl.textContent = "Heap unavailable";
            return;
          }
          const ramData = new Uint8Array(gbcModule.HEAPU8.buffer, ptr, size);
          const blob = new Blob([ramData], {
            type: "application/octet-stream",
          });
          const url = URL.createObjectURL(blob);
          const anchor = document.createElement("a");
          anchor.href = url;
          anchor.download = "save.bin";
          document.body.appendChild(anchor);
          anchor.click();
          document.body.removeChild(anchor);
          URL.revokeObjectURL(url);
          statusEl.textContent = "Save exported";
        } catch (error) {
          console.error("Export save error", error);
          statusEl.textContent = "Error exporting save";
        }
      });

      importSaveBtn?.addEventListener("click", () => saveInput?.click());

      saveInput?.addEventListener("change", (event) => {
        const file = event.target.files?.[0];
        if (!file) return;
        if (!runtimeReady) {
          statusEl.textContent = "Runtime still starting…";
          return;
        }
        statusEl.textContent = `Loading ${file.name}…`;
        const reader = new FileReader();
        reader.onload = () => {
          try {
            const data = toUint8Array(reader.result);
            const result = callBufferApi(data, "import_save");
            statusEl.textContent =
              result === 1 ? `Loaded ${file.name}` : "Failed to load save";
          } catch (error) {
            console.error("Save import failed", error);
            statusEl.textContent = `Error loading save: ${error.message}`;
          } finally {
            saveInput.value = "";
          }
        };
        reader.onerror = () => {
          console.error("FileReader error", reader.error);
          statusEl.textContent = "Error reading save";
          saveInput.value = "";
        };
        reader.readAsArrayBuffer(file);
      });

      volumeSlider?.addEventListener("input", (event) => {
        const value = Number(event.target.value);
        if (volumeLabel) {
          volumeLabel.textContent = `${value}%`;
        }
        if (runtimeReady && gbcModule?._set_master_volume) {
          gbcModule._set_master_volume(value / 100);
        }
      });

      initModule();
    </script>
  </body>
</html>
