name: Build and Deploy Web Emulator

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v13
        with:
          version: latest

      - name: Configure CMake
        run: |
          emcmake cmake -B build_wasm -S . \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cmake --build build_wasm --config Release

      - name: Copy files to docs
        run: |
          mkdir -p docs
          cp shell.html docs/index.html
          cp build_wasm/GBC.js docs/ || cp build_wasm/*.js docs/ || (echo "Error: No JS file found" && exit 1)
          cp build_wasm/GBC.wasm docs/ || cp build_wasm/*.wasm docs/ || (echo "Error: No WASM file found" && exit 1)

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4



